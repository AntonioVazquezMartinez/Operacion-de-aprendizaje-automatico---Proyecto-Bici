name: tests

on:
  push:
    branches: [main, fase-final]
  pull_request:
    branches: [main]

# Un push a una rama con PR abierto dispara `push` y `pull_request` con el mismo código: ambos caen en el
# mismo grupo (nombre de la rama) y la ejecución anterior se cancela, así que solo corre una.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instala dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Corre las pruebas con cobertura
        run: python -m pytest -q --cov=src --cov-report=term-missing
