name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # misma versión con la que se entrenó el modelo
          cache: pip
      - name: Instala dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Corre las pruebas
        run: python -m pytest -v
      - name: Verifica la reproducibilidad del modelo desplegable
        run: python -m src.serving.verify

  docker:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construye la imagen
        run: docker build -t mibici-demand-api:ci .
      - name: Verifica el modelo dentro del contenedor
        run: docker run --rm mibici-demand-api:ci python -m src.serving.verify
      - name: Prueba de humo de la API
        run: |
          docker run -d --name api -p 8000:8000 mibici-demand-api:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 2; done
          curl -sf -X POST http://localhost:8000/predict -H "Content-Type: application/json" \
            -d '{"instances":[{"station_id":2,"fecha_hora":"2025-12-31T18:00:00"}]}'
          docker rm -f api
