seed: 42
paths:
  raw_dir: /work/data/raw
  interim_dir: /work/data/interim
  processed_dir: /work/data/processed
  external_dir: /work/data/external
  models_dir: /work/models
  figures_dir: /work/reports/figures
  reports_dir: /work/reports
data:
  months:
  - 2025-01
  - 2025-02
  - 2025-03
  - 2025-04
  - 2025-05
  - 2025-06
  - 2025-07
  - 2025-08
  - 2025-09
  - 2025-10
  - 2025-11
  - 2025-12
  trip_urls:
    2024-05: https://www.mibici.net/site/assets/files/81663/datos_abiertos_2024_05.csv
    2025-01: https://www.mibici.net/site/assets/files/97653/datos_abiertos_2025_01.csv
    2025-02: https://www.mibici.net/site/assets/files/99879/datos_abiertos_2025_02.csv
    2025-03: https://www.mibici.net/site/assets/files/101986/datos_abiertos_2025_03.csv
    2025-04: https://www.mibici.net/site/assets/files/103813/datos_abiertos_2025_04.csv
    2025-05: https://www.mibici.net/site/assets/files/105513/datos_abiertos_2025_05.csv
    2025-06: https://www.mibici.net/site/assets/files/107088/datos_abiertos_2025_06.csv
    2025-07: https://www.mibici.net/site/assets/files/108898/datos_abiertos_2025_07.csv
    2025-08: https://www.mibici.net/site/assets/files/111021/datos_abiertos_2025_08.csv
    2025-09: https://www.mibici.net/site/assets/files/113216/datos_abiertos_2025_09.csv
    2025-10: https://www.mibici.net/site/assets/files/115104/datos_abiertos_2025_10.csv
    2025-11: https://www.mibici.net/site/assets/files/116773/datos_abiertos_2025_11.csv
    2025-12: https://www.mibici.net/site/assets/files/118153/datos_abiertos_2025_12.csv
  stations_url: https://www.mibici.net/site/assets/files/1118/nomenclatura_2026_10.csv
  download_timeout_seconds: 120
  raw_trips_file: viajes_raw.csv
  stations_file: nomenclatura_estaciones.csv
  interim_file: viajes_cleaned.csv
  features_file: mibici_hourly_demand.csv
cleaning:
  min_duration_seconds: 60
  max_duration_minutes: 120
  min_age: 14
  max_age: 90
features:
  target: demand_count
  lag_hours:
  - 24
  - 168
  same_hour_mean_days: 7
  drop_incomplete_history: true
  numeric_base:
  - sin_hour
  - cos_hour
  - sin_dayofweek
  - cos_dayofweek
  - latitude
  - longitude
  - capacity
  binary:
  - is_weekend
  - is_holiday
  categorical:
  - Origen_Id
split:
  train_size: 0.7
  val_size: 0.15
mlflow:
  tracking_uri: sqlite:////work/mlruns.db
  artifact_dir: /work/mlartifacts
  data_experiment: MiBici_Datos
  training_experiment: MiBici_Fase2_Modelos
  registered_model_name: mibici-demand-forecaster
  champion_alias: champion
  challenger_alias: challenger
  log_dataset_artifacts: false
tuning:
  metric: val_mae
  n_trials: 20
  timeout_seconds: null
  train_sample_rows: 300000
serving:
  model_dir: /work/models/champion
  metadata_file: /work/models/champion_metadata.json
  reference_predictions_file: /work/models/reference_predictions.csv
  reference_sample_rows: 500
  stations_file: stations.csv
  service_version: 1.0.0
  max_batch_size: 1000
  local_utc_offset: -06:00
  require_sha256_match: true
  strict_startup: false
models:
  dummy_mean:
    enabled: true
    register: false
    class: sklearn.dummy.DummyRegressor
    params:
      strategy: mean
  poisson:
    enabled: true
    register: true
    class: sklearn.linear_model.PoissonRegressor
    params:
      max_iter: 500
    search_space:
      alpha:
        type: float
        low: 1.0e-06
        high: 1.0
        log: true
  hist_gradient_boosting:
    enabled: true
    register: true
    class: sklearn.ensemble.HistGradientBoostingRegressor
    params:
      loss: poisson
      early_stopping: false
    search_space:
      learning_rate:
        type: float
        low: 0.02
        high: 0.3
        log: true
      max_iter:
        type: int
        low: 100
        high: 500
      max_leaf_nodes:
        type: int
        low: 15
        high: 127
      min_samples_leaf:
        type: int
        low: 20
        high: 200
      l2_regularization:
        type: float
        low: 1.0e-06
        high: 1.0
        log: true
  random_forest:
    enabled: true
    register: true
    class: sklearn.ensemble.RandomForestRegressor
    params:
      n_jobs: -1
      max_samples: 0.1
    n_trials: 5
    search_space:
      n_estimators:
        type: int
        low: 30
        high: 100
      max_depth:
        type: int
        low: 6
        high: 14
      min_samples_leaf:
        type: int
        low: 20
        high: 100
      max_features:
        type: float
        low: 0.3
        high: 1.0
monitoring:
  experiment_name: MiBici_Monitoreo
  model_dir: models/champion
  output_dir: reports/drift
  reference_split: val
  baseline_split: test
  psi_bins: 10
  psi_epsilon: 0.0001
  discrete_max_unique: 30
  ks_sample_rows: 50000
  window_days: 7
  informative_variables:
  - sin_hour
  - cos_hour
  - sin_dayofweek
  - cos_dayofweek
  - is_weekend
  - is_holiday
  thresholds:
    psi:
      warning: 0.1
      alert: 0.25
    ks_statistic:
      warning: 0.1
      alert: 0.2
    wasserstein_norm:
      warning: 0.1
      alert: 0.25
    missing_rate:
      warning: 0.01
      alert: 0.05
    count_domain_violation_rate:
      warning: 0.01
      alert: 0.05
    unseen_category_rate:
      warning: 0.01
      alert: 0.05
    hour_profile_shift_hours:
      warning: 1
      alert: 2
    mae_degradation:
      warning: 0.1
      alert: 0.25
    wape_degradation:
      warning: 0.1
      alert: 0.25
  scenarios:
    control:
      type: control
      description: Conjunto de prueba sin alteración (valida que los umbrales no den
        falsas alarmas).
    rezagos_faltantes:
      type: missing_lags
      fraction: 0.3
      description: 30 % de las filas sin rezagos (falla de la consulta histórica;
        el imputador usa la mediana).
    rezagos_escala:
      type: scale_lags
      factor: 1.5
      description: Rezagos multiplicados por 1.5 (unidades o agregación equivocadas
        en el pipeline).
    reloj_desfasado:
      type: clock_shift
      hours: 6
      description: Variables de calendario calculadas con 6 h de desfase (UTC en lugar
        de hora de Guadalajara).
    aumento_demanda:
      type: demand_change
      factor: 1.4
      description: 40 % más viajes (remuestreo con reemplazo); se recalculan rezagos
        y objetivo.
    caida_demanda:
      type: demand_change
      factor: 0.6
      description: 40 % menos viajes (adelgazamiento binomial); se recalculan rezagos
        y objetivo.
    vacaciones_diciembre:
      type: time_window
      start: 2025-12-20 00:00
      end: 2025-12-31 23:00
      description: Periodo real de vacaciones y fiestas de fin de año (20 al 31 de
        diciembre de 2025).
    estaciones_nuevas:
      type: new_stations
      fraction: 0.15
      id_offset: 100000
      description: 15 % de estaciones con Id nuevo que abren al inicio de la ventana
        (sin historial ni codificación).
