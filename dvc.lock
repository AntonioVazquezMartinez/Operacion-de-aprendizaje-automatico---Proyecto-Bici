      size: 84116
  drift:
    cmd: python -m src.monitoring.drift
    deps:
    - path: data/interim/viajes_cleaned.csv
      hash: md5
      md5: ed04797a6c969851f2ee4b9dc81020cc
      size: 436953575
    - path: data/processed/mibici_hourly_demand.csv
      hash: md5
      md5: 36edcf456ac2307329ac03dafa358d39
      size: 495441249
    - path: data/raw/nomenclatura_estaciones.csv
      hash: md5
      md5: e131a442bd72fd997d73a10a1ecd7317
      size: 34291
    - path: models/champion
      hash: md5
      md5: ebe973e8988acd803be73e17e967a279.dir
      size: 6188355
      nfiles: 8
    - path: src/features.py
      hash: md5
      md5: 70ad690204faf0172e2d101a97092944
      size: 10773
    - path: src/modeling/pipeline.py
      hash: md5
      md5: f758b98d130703853b363d6348888b06
      size: 3629
    - path: src/monitoring
      hash: md5
      md5: 7ef4950f8968ac8d80678146349ba64f.dir
      size: 198262
      nfiles: 14
    params:
      config.yaml:
        monitoring:
          experiment_name: MiBici_Monitoreo
          model_dir: models/champion
          output_dir: reports/drift
          reference_split: val
          baseline_split: test
          psi_bins: 10
          psi_epsilon: 0.0001
          discrete_max_unique: 30
          ks_sample_rows: 50000
          window_days: 7
          informative_variables:
          - sin_hour
          - cos_hour
          - sin_dayofweek
          - cos_dayofweek
          - is_weekend
          - is_holiday
          thresholds:
            psi:
              warning: 0.1
              alert: 0.25
            ks_statistic:
              warning: 0.1
              alert: 0.2
            wasserstein_norm:
              warning: 0.1
              alert: 0.25
            missing_rate:
              warning: 0.01
              alert: 0.05
            count_domain_violation_rate:
              warning: 0.01
              alert: 0.05
            unseen_category_rate:
              warning: 0.01
              alert: 0.05
            hour_profile_shift_hours:
              warning: 1
              alert: 2
            mae_degradation:
              warning: 0.1
              alert: 0.25
            wape_degradation:
              warning: 0.1
              alert: 0.25
          scenarios:
            control:
              type: control
              description: Conjunto de prueba sin alteración (valida que los 
                umbrales no den falsas alarmas).
            rezagos_faltantes:
              type: missing_lags
              fraction: 0.3
              description: 30 % de las filas sin rezagos (falla de la consulta 
                histórica; el imputador usa la mediana).
            rezagos_escala:
              type: scale_lags
              factor: 1.5
              description: Rezagos multiplicados por 1.5 (unidades o agregación 
                equivocadas en el pipeline).
            reloj_desfasado:
              type: clock_shift
              hours: 6
              description: Variables de calendario calculadas con 6 h de desfase
                (UTC en lugar de hora de Guadalajara).
            aumento_demanda:
              type: demand_change
              factor: 1.4
              description: 40 % más viajes (remuestreo con reemplazo); se 
                recalculan rezagos y objetivo.
            caida_demanda:
              type: demand_change
              factor: 0.6
              description: 40 % menos viajes (adelgazamiento binomial); se 
                recalculan rezagos y objetivo.
            vacaciones_diciembre:
              type: time_window
              start: 2025-12-20 00:00
              end: 2025-12-31 23:00
              description: Periodo real de vacaciones y fiestas de fin de año 
                (20 al 31 de diciembre de 2025).
            estaciones_nuevas:
              type: new_stations
              fraction: 0.15
              id_offset: 100000
              description: 15 % de estaciones con Id nuevo que abren al inicio 
                de la ventana (sin historial ni codificación).
        seed: 42
