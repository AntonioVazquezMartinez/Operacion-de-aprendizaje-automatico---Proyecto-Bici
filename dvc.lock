      size: 14525
    - path: src/tracking.py
      hash: md5
      md5: 000fe64713ae8645e0e37c00fd3e6c14
      size: 3454
    params:
      config.yaml:
        mlflow:
          tracking_uri: sqlite:///mlruns.db
          artifact_dir: mlartifacts
          data_experiment: MiBici_Datos
          training_experiment: MiBici_Fase2_Modelos
          registered_model_name: mibici-demand-forecaster
          champion_alias: champion
          challenger_alias: challenger
          log_dataset_artifacts: false
        models:
          dummy_mean:
            enabled: true
            register: false
            class: sklearn.dummy.DummyRegressor
            params:
              strategy: mean
          poisson:
            enabled: true
            register: true
            class: sklearn.linear_model.PoissonRegressor
            params:
              max_iter: 500
            search_space:
              alpha:
                type: float
                low: 1e-06
                high: 1.0
                log: true
          hist_gradient_boosting:
            enabled: true
            register: true
            class: sklearn.ensemble.HistGradientBoostingRegressor
            params:
              loss: poisson
              early_stopping: false
            search_space:
              learning_rate:
                type: float
                low: 0.02
                high: 0.3
                log: true
              max_iter:
                type: int
                low: 100
                high: 500
              max_leaf_nodes:
                type: int
                low: 15
                high: 127
              min_samples_leaf:
                type: int
                low: 20
                high: 200
              l2_regularization:
                type: float
                low: 1e-06
                high: 1.0
                log: true
          random_forest:
            enabled: true
            register: true
            class: sklearn.ensemble.RandomForestRegressor
            params:
              n_jobs: -1
              max_samples: 0.1
            n_trials: 5
            search_space:
              n_estimators:
                type: int
                low: 30
                high: 100
              max_depth:
                type: int
                low: 6
                high: 14
              min_samples_leaf:
                type: int
                low: 20
                high: 100
              max_features:
                type: float
                low: 0.3
                high: 1.0
        seed: 42
        split:
          train_size: 0.7
          val_size: 0.15
        tuning:
          metric: val_mae
          n_trials: 20
          timeout_seconds:
          train_sample_rows: 300000
    outs:
