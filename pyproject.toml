[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mibici-mlops"
version = "0.1.0"
description = "Pipeline de datos para predecir la demanda horaria por estación en MiBici Guadalajara (Fase 1, Equipo 19)"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["src*"]
