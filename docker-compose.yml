# Servicio de predicción de MiBici con Docker Compose.
#   docker compose up -d            # usa la imagen publicada (docker pull automático)
#   docker compose up -d --build    # construye localmente con el Dockerfile (el modelo está en Git)
#   docker compose down
# MIBICI_TAG elige el tag publicado (por omisión 1.1.0; MIBICI_TAG=1.0.0 para la primera versión); ver docs/docker.md.
services:
  api:
    image: gusrivasmna/mibici-demand-service:${MIBICI_TAG:-1.1.0}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
